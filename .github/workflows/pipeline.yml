name: jobdep
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.appver.outputs.version }}
    steps:
       - name: app version
         id: appver
         run: echo "version=1.0.0" > $GITHUB_OUTPUT
  test:
     runs-on: ubuntu-latest
     needs: build
     steps:
       - name: run test
         run: echo "test completed"
  deploy:
     runs-on: ubuntu-latest
     needs: [build, test]
     steps:
       - name: read build version
         run: echo "${{ needs.build.outputs.version }}"
