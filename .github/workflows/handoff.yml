name: upload-download-example
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: create package
        run: echo "myapp" > app.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt
          retention-days: 5
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download package
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: verify the package
        run: test -f app.txt
