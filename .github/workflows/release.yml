name: pattern-workflow
on:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: run lint check
        run: echo "lint check completed"
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: run unit test
        run: echo "unit test completed"
  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: package the app
        run: echo "app packaged"
