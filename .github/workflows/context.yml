name: context
on:
  push:
jobs:
  context-jobs:
   runs-on: ubuntu-latest
   steps:
     - name: print rep name
       run: echo "${{ github.repository }}"
     - name: print branch name
       run: echo  "${{ github.ref }}"
     - name: print commit id
       run: echo "${{ github.sha }}"
     - name: event name
       run: echo  "${{ github.event_name }}"
     - name: runner os
       run: echo "${{ runner.os }}"
