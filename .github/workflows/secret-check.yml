name: secret-demo
on:
  push:
jobs:
  secret-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: secret demo
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
           if [-n $APP_TOKEN ];then
             echo "secret value set"
           else
              echo "secret value not set"
              exit 1
           fi
